name: Android M0

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13 (verified, fallback mirrors)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gradle-install"
          zip="$RUNNER_TEMP/gradle-8.13-bin.zip"
          # Official Gradle 8.13 binary ZIP SHA-256: https://gradle.org/release-checksums/
          expected="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
          urls=(
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip"
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip"
          )
          installed=false
          for url in "${urls[@]}"; do
            echo "Downloading Gradle distribution from ${url}"
            if curl -fSL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 -o "$zip" "$url"; then
              if printf '%s  %s\n' "$expected" "$zip" | sha256sum --check --status; then
                installed=true
                break
              fi
              echo "Checksum mismatch, refusing downloaded distribution"
            fi
            rm -f "$zip"
          done
          if [ "$installed" != true ]; then
            echo "::error::Gradle 8.13 download/checksum failed on all mirrors"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/gradle-install"
          echo "$RUNNER_TEMP/gradle-install/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verified Kotlin compiler 2.3.10 (Maven Central CDN fallback)
        shell: bash
        run: |
          set -euo pipefail
          base="org/jetbrains/kotlin/kotlin-compiler-embeddable/2.3.10"
          dir="$RUNNER_TEMP/enotone-ci-maven/$base"
          mkdir -p "$dir"
          jar="kotlin-compiler-embeddable-2.3.10.jar"
          pom="kotlin-compiler-embeddable-2.3.10.pom"
          # SHA-256 from JetBrains/kotlin gradle/verification-metadata.xml.
          expected="ac6a182785345380b5db5085dbeea3f5f0e925e2e100e54ab059b5787d4f6e40"
          urls=(
            "https://mirrors.huaweicloud.com/repository/maven"
            "https://artifacts-oss.talend.com/nexus/content/repositories/public"
            "https://repo.maven.apache.org/maven2"
          )
          verified=false
          for url in "${urls[@]}"; do
            if curl -fSL --retry 2 --retry-delay 4 --connect-timeout 15 --max-time 180 \
              -o "$dir/$jar" "$url/$base/$jar"; then
              if printf '%s  %s\n' "$expected" "$dir/$jar" | sha256sum --check --status; then
                verified=true
                break
              fi
              echo "Kotlin compiler checksum mismatch from $url"
            fi
            rm -f "$dir/$jar"
          done
          if [ "$verified" != true ]; then
            echo "::error::Cannot obtain verified Kotlin compiler 2.3.10"
            exit 1
          fi
          # Fetch the small Maven POM from the canonical endpoint; fallback for availability only.
          if ! curl -fSL --retry 2 --retry-delay 4 --connect-timeout 15 --max-time 30 \
            -o "$dir/$pom" "https://repo.maven.apache.org/maven2/$base/$pom"; then
            curl -fSL --retry 2 --retry-delay 4 --connect-timeout 15 --max-time 30 \
              -o "$dir/$pom" "https://mirrors.huaweicloud.com/repository/maven/$base/$pom"
          fi
          echo "ENOTONE_CI_COMPILER_MIRROR=$RUNNER_TEMP/enotone-ci-maven" >> "$GITHUB_ENV"
      - name: Mock WebDAV tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      # Reject a tampered gradle-wrapper.jar (supply-chain check for ./gradlew users).
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      # Root tasks run in EVERY module, so new modules are tested and linted
      # without editing this file (ADR-0074, M6-0/8).
      - name: Build, JUnit and Lint (all modules)
        run: gradle --no-daemon :app:assembleDebug testDebugUnitTest lintDebug
      # Report-only until findings are fixed (ignoreFailures in build.gradle.kts).
      - name: detekt + ktlint rules (report-only)
        run: gradle --no-daemon detekt
      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore
          retention-days: 14
      # Validate this brand-new build variant even on PRs where signing
      # secrets are deliberately unavailable. Compiles only, never packages an
      # unsigned stable APK or uploads it as a distributable artifact.
      - name: Compile stable Preview variant (no signing secrets)
        run: gradle --no-daemon :app:compileStablePreviewKotlin

      - name: Verify Room v1 schema matches committed JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          path = pathlib.Path("core/database/schemas/app.enotone.database.EnoToneDatabase/1.json")
          actual = json.loads(path.read_text(encoding="utf-8"))
          saved = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:" + path.as_posix()], text=True))
          assert actual == saved, "Room schema changed without an explicit migration"
          assert actual["database"]["version"] == 1
          upgraded = pathlib.Path("core/database/schemas/app.enotone.database.EnoToneDatabase/2.json")
          assert upgraded.exists(), "Room must export the new v2 schema"
          v2 = json.loads(upgraded.read_text(encoding="utf-8"))
          assert v2["database"]["version"] == 2
          assert any(f["columnName"] == "tagScanCode" for e in v2["database"]["entities"]
                     if e["tableName"] == "remote_tracks" for f in e["fields"])
          saved_v2 = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:" + upgraded.as_posix()], text=True))
          assert v2 == saved_v2, "Room v2 schema changed without explicit migration"
          exported_v3 = pathlib.Path("core/database/schemas/app.enotone.database.EnoToneDatabase/3.json")
          assert exported_v3.exists(), "Room v3 schema must be exported and committed"
          v3 = json.loads(exported_v3.read_text(encoding="utf-8"))
          assert v3["database"]["version"] == 3
          columns = [f["columnName"] for e in v3["database"]["entities"]
                     if e["tableName"] == "remote_tracks" for f in e["fields"]]
          assert all(name in columns for name in ("year", "trackNumber", "discNumber"))
          saved_v3 = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:" + exported_v3.as_posix()], text=True))
          assert v3 == saved_v3, "Room v3 schema changed without explicit migration"
          exported_v4 = pathlib.Path("core/database/schemas/app.enotone.database.EnoToneDatabase/4.json")
          assert exported_v4.exists(), "Room v4 schema must be exported and committed"
          v4 = json.loads(exported_v4.read_text(encoding="utf-8"))
          assert v4["database"]["version"] == 4
          genre_fields = [f for e in v4["database"]["entities"]
                          if e["tableName"] == "remote_tracks"
                          for f in e["fields"] if f["columnName"] == "genre"]
          assert len(genre_fields) == 1 and genre_fields[0]["affinity"] == "TEXT"
          saved_v4 = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:" + exported_v4.as_posix()], text=True))
          assert v4 == saved_v4, "Room v4 schema changed without explicit migration"
          print("Room schemas v1, v2, v3 and v4 match committed JSON; migration history retained")

          PY
      - name: Resolved dependencies
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt
      - name: Check GMS-free dependencies and APK
        run: python3 tools/check_no_gms.py dependencies.txt app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect blocked APK GMS markers (does not waive gate)
        if: failure()
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              print("APK not built; nothing to inspect")
          else:
              with zipfile.ZipFile(apk) as archive:
                  for name in archive.namelist():
                      if not name.endswith(".dex"):
                          continue
                      raw = archive.read(name)
                      for marker in (b"com.google.android.gms", b"com/google/android/gms"):
                          pos = raw.find(marker)
                          if pos < 0:
                              continue
                          context = raw[max(0, pos - 96):pos + len(marker) + 96]
                          print(f"{name}: marker {marker!r} at offset {pos}")
                          print("DEX nearby ASCII:", "".join(chr(x) if 32 <= x <= 126 else "." for x in context))
          PY
      - name: Verify isolated preview APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$aapt" dump badging "$apk" | grep -E "^package: name='app.enotone.android.preview.r${GITHUB_RUN_NUMBER}' "
          "$aapt" dump badging "$apk" | grep -F "application-label:'enoTone Preview #${GITHUB_RUN_NUMBER}'"
          "$apksigner" verify --print-certs "$apk" | grep "Signer #1 certificate SHA-256 digest:"
          echo "::notice::Isolated preview package; runner-generated debug signatures are not stable between runs"
      - name: Upload debug APK
        id: upload_preview
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: enotone-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Direct Preview ZIP link in run summary
        if: success()
        env:
          PREVIEW_ARTIFACT_ID: ${{ steps.upload_preview.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_ARTIFACT_ID"
          {
            echo '### Download enoTone Preview'
            echo
            echo "[Download APK ZIP](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${PREVIEW_ARTIFACT_ID})"
            echo
            echo 'Requires GitHub sign-in. Unzip and install app-debug.apk.'
            echo 'Each Preview run has its own package ID and separate local Room database.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Stable Preview is an opt-in, main-only update channel. Never make
      # signing secrets accessible to pull_request builds or untrusted forks.
      - name: Prepare stable Preview keystore (main only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENOTONE_STABLE_PREVIEW_ENABLED == 'true'
        shell: bash
        env:
          ENOTONE_KEYSTORE_BASE64: ${{ secrets.ENOTONE_PREVIEW_KEYSTORE_BASE64 }}
          ENOTONE_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ENOTONE_PREVIEW_KEYSTORE_PASSWORD }}
          ENOTONE_PREVIEW_CERT_SHA256: ${{ vars.ENOTONE_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ENOTONE_KEYSTORE_BASE64" ] ||
             [ -z "$ENOTONE_PREVIEW_KEYSTORE_PASSWORD" ] ||
             [ -z "$ENOTONE_PREVIEW_CERT_SHA256" ]; then
            echo "::error::Stable Preview signing configuration is incomplete"
            exit 1
          fi
          printf '%s' "$ENOTONE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/enotone-preview.p12"
          test -s "$RUNNER_TEMP/enotone-preview.p12"

      - name: Build and verify stable Preview APK (main only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENOTONE_STABLE_PREVIEW_ENABLED == 'true'
        shell: bash
        env:
          ENOTONE_PREVIEW_KEYSTORE_PATH: ${{ runner.temp }}/enotone-preview.p12
          ENOTONE_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ENOTONE_PREVIEW_KEYSTORE_PASSWORD }}
          ENOTONE_PREVIEW_CERT_SHA256: ${{ vars.ENOTONE_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleStablePreview
          apk="app/build/outputs/apk/stablePreview/app-stablePreview.apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$aapt" dump badging "$apk" |
            grep -F "package: name='app.enotone.android.preview' versionCode='${GITHUB_RUN_NUMBER}' "
          "$aapt" dump badging "$apk" | grep -F "application-label:'enoTone Preview'"
          actual="$("$apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$actual"
          wanted="$(printf '%s' "$ENOTONE_PREVIEW_CERT_SHA256" |
            tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$wanted" ]; then
            echo "::error::Stable Preview signing certificate fingerprint mismatch"
            exit 1
          fi
          python3 tools/check_no_gms.py dependencies.txt "$apk"
          echo "::notice::Stable Preview APK: same package and pinned signing certificate for updates"

      - name: Upload verified stable Preview APK
        id: upload_stable_preview
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENOTONE_STABLE_PREVIEW_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: enotone-stable-preview-apk
          path: app/build/outputs/apk/stablePreview/app-stablePreview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Link stable Preview in run summary
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.ENOTONE_STABLE_PREVIEW_ENABLED == 'true'
        shell: bash
        env:
          STABLE_ARTIFACT_ID: ${{ steps.upload_stable_preview.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$STABLE_ARTIFACT_ID"
          {
            echo '### Stable enoTone Preview (in-place updates)'
            echo
            echo "[Download stable Preview APK ZIP](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${STABLE_ARTIFACT_ID})"
            echo
            echo 'Install once; install following stable Preview builds over it without uninstalling.'
            echo 'The old per-run .preview.rN packages have separate Room databases.'
            echo 'Do not use old per-run debug artifacts as upgrades.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete transient signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/enotone-preview.p12"

      - name: Upload blocked diagnostic APK (not approved for installation)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enotone-m0-blocked-diagnostic-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
