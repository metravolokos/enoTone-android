name: Android M0

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Mock WebDAV tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build, JUnit and Lint
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :core:network:testDebugUnitTest :app:lintDebug
      - name: Resolved dependencies
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt
      - name: Check GMS-free dependencies and APK
        run: python3 tools/check_no_gms.py dependencies.txt app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: enotone-m0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
